<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIDS Datasets table</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:hover { background-color: #f5f5f5; }
        tr.htmx-swapping {
        opacity: 0;
        transition: opacity 0.5s ease-out;
    }
    </style>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

    <h1>Archivio Dataset BIDS</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Partecipanti</th>
                <th>Licenza</th>
                <th>Modalità</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            {% for d in datasets %}
            <tr>
                <td>{{ d.id }}</td>
                <td>{{ d.name }}</td>
                <td>{{ d.participants }}</td>
                <td>{{ d.license.value }}</td> <td>
                    {% for m in d.modalities %}
                        <span style="background: #eee; padding: 2px; border-radius: 4px;">
                            {{ m.name.value }}
                        </span>
                    {% endfor %}
                </td>
                <td>
                <button 
                    hx-delete="/datasets/{{ d.id }}" 
                    hx-confirm="Sei sicuro di voler eliminare il dataset {{ d.name }}?"
                    hx-target="closest tr" 
                    hx-swap="outerHTML swap:0.5s">
                    Elimina
                </button>
            </td>
            </tr>
            {% endfor %}

            
            </tbody>
    </table>

    
</body>
</html>
